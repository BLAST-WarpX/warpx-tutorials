name: Build tutorial image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Derive the image from the repo owner so this works on any fork
          # (GHCR requires a lowercase name). Pushes to the fork's own namespace.
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/tutorial"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build docker image
        run: |
          docker build \
            --file containers/tutorial/Dockerfile \
            --tag "${{ steps.tags.outputs.latest }}" \
            --tag "${{ steps.tags.outputs.sha }}" \
            .

      - name: Push docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.tags.outputs.latest }}"
          docker push "${{ steps.tags.outputs.sha }}"
