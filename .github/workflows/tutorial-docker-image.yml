name: Build tutorial image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

# A cold build of both compute flavors takes far longer than the 6 h GitHub
# job limit (the single-job predecessor already needed 5.5 h for the CUDA
# flavor alone). So each flavor is compiled in its own job, in parallel, and
# publishes its installed trees as a scratch image; a short assemble job then
# composes the final image from them via BuildKit build contexts.
jobs:
  flavor:
    name: Build ${{ matrix.flavor }} flavor
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, gpu]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The CUDA devel base plus the nvcc object trees need more room than a
      # stock runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}"
          df -h /

      # Artifacts can only be published when the token can write to GHCR,
      # i.e. not for pull requests from forks.
      - name: Determine whether artifacts can be published
        id: publish
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Derive the image from the repo owner so this works on any fork
          # (GHCR requires a lowercase name). Pushes to the fork's own namespace.
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "artifact=${IMAGE}/tutorial-artifacts:${{ matrix.flavor }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "cache=${IMAGE}/tutorial:buildcache-${{ matrix.flavor }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Registry cache, not type=gha: the Actions cache is capped at 10 GB per
      # repository, which a single CUDA builder stage exceeds on its own.
      - name: Build ${{ matrix.flavor }} artifacts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/tutorial/Dockerfile
          target: export-${{ matrix.flavor }}
          build-args: |
            CUDAARCHS=75
            NJOBS=4
          tags: ${{ steps.tags.outputs.artifact }}
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: ${{ steps.publish.outputs.enabled == 'true' && format('type=registry,ref={0},mode=max', steps.tags.outputs.cache) || '' }}

  assemble:
    name: Assemble tutorial image
    runs-on: ubuntu-latest
    needs: flavor
    # Needs both flavor artifacts in the registry; fork pull requests cannot
    # publish them, so there they stop after compiling both flavors.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "latest=${IMAGE}/tutorial:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${IMAGE}/tutorial:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "cpu=${IMAGE}/tutorial-artifacts:cpu-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "gpu=${IMAGE}/tutorial-artifacts:gpu-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Substituting the two builder stages means nothing is recompiled here:
      # only the final runtime stage runs.
      - name: Assemble and push tutorial image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/tutorial/Dockerfile
          target: tutorial
          build-contexts: |
            build-cpu=docker-image://${{ steps.tags.outputs.cpu }}
            build-gpu=docker-image://${{ steps.tags.outputs.gpu }}
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}
          push: ${{ github.event_name != 'pull_request' }}
